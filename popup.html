<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title">
      <span class="logo">SB</span>
      ChatGPT Speed Booster
      <span class="badge">v6</span>
    </div>
    <div class="subtitle">Show only the latest messages</div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <span class="stat-value" id="visibleCount">0 / 0</span>
      <span class="stat-label">Visible</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="hiddenCount">0</span>
      <span class="stat-label">Hidden</span>
    </div>
  </div>

  <div class="setting-row compact">
    <span class="setting-label">Enable Speed Booster</span>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <div>
      <span class="setting-label">Messages shown</span>
      <div class="setting-hint">Older messages are removed from live DOM and can be loaded above the chat.</div>
    </div>
    <input type="number" id="visibleMessages" min="2" max="200" value="15" class="number-input">
  </div>

  <div class="footer" id="statusBar">
    Waiting for ChatGPT...
  </div>

  <script src="popup.js"></script>
</body>
</html>
